spring.application.name=FinPal

# DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/finpal_db
spring.datasource.username=finpal_user
spring.datasource.password=finpal_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.options=-c TimeZone=Europe/Kyiv

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server
server.port=8080