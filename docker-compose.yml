version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: finpal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finpal_db
      POSTGRES_USER: finpal_user
      POSTGRES_PASSWORD: finpal_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
